<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene cursor="rayOrigin: mouse">
      <a-plane
        position="0 0 -8"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="red"
      >
      </a-plane>

      <a-box
        position="0 2 -13"
        width="10"
        height="4"
        depth="0.3"
        color="#ccc"
      ></a-box>

      <a-box
        position="-4.75125 2 -8"
        width="0.3"
        height="4"
        depth="10"
        color="#ddd"
      ></a-box>

      <a-box
        position="4.75965 2 -8"
        width="0.3"
        height="4"
        depth="10"
        color="#ddd"
      ></a-box>
      <a-box
        position="0 3.18781 -3.8"
        width="9.2"
        height="4"
        depth="0.3"
        color="#ccc"
        geometry="height: 1"
      ></a-box>

      <a-box
        position="2.58521 1.30444 -3.8"
        width="9.2"
        height="4"
        depth="0.3"
        color="#ccc"
        geometry="height: 2.8; width: 4.2"
      ></a-box>
      <a-box
        position="-2.76545 1.30444 -3.8"
        width="9.2"
        height="4"
        depth="0.3"
        color="#ccc"
        geometry="height: 2.8; width: 3.8"
      ></a-box>

      <!-- 🚪 DOOR PIVOT FIX -->
      <a-entity
        id="doorPivot"
        position="-0.9 1.3 -3.55"
        animation="property: rotation; to: 0 -100 0; dur: 1000; startEvents: openDoor"
      >
        <a-box
          id="door"
          position="0.75 0 0"
          width="1.5"
          height="2.8"
          depth="0.1"
          color="#6b3e26"
        >
          <!-- HANDLE -->
          <a-sphere
            id="handle"
            position="0.4 0 0.08"
            radius="0.05"
            color="gold"
          >
          </a-sphere>
        </a-box>
      </a-entity>

      <!-- CAMERA -->
      <a-entity id="cam" camera position="0 1.6 0"></a-entity>

      <!-- SKY -->
      <a-sky color="#ECECEC"></a-sky>

      <!-- SCRIPT -->
      <script>
        const doorPivot = document.querySelector("#doorPivot");
        const handle = document.querySelector("#handle");
        const cam = document.querySelector("#cam");

        let opened = false;

        handle.addEventListener("click", () => {
          if (opened) return;
          opened = true;

          // 🚪 open door
          doorPivot.emit("openDoor");

          // 👣 enter room
          setTimeout(() => {
            cam.setAttribute(
              "animation",
              "property: position; to: 0 1.6 -7; dur: 2000; easing: easeInOutQuad",
            );
          }, 800);
        });
      </script>
    </a-scene>
  </body>
</html>
